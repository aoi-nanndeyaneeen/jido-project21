; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]

default_envs = auto_flight


[env]
; --- 全環境共通の設定 ---
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bolderflight/Bolder Flight Systems SBUS @ ^8.1.4 
    bitcraze/Bitcraze PMW3901 @ ^1.2.0  ; 👈 公式レジストリ版のみ残す
    https://github.com/DamarXCV/Teensy-DShot.git


monitor_filters = direct
build_flags = -std=c++17

monitor_speed = 115200
; 各環境のメインファイル名と自動連動させる魔法のフィルター
; これにより、各envでいちいち他のファイルをマイナス（除外）して回る必要がなくなります
build_src_filter = +<*> -<main.cpp> -<auto_flight.cpp> -<Zunrocoptor.cpp> -<uchida.cpp> -<drone.cpp>-<test.cpp>-<trainer.cpp> +<${PIOENV}.cpp>


; --- 基板ごとのハードウェアテンプレート（非表示セクション __ ） ---
; セクション名に「__」を付けることで、PlatformIOのビルド対象リストに出てこない「純粋な型」にできます
[__teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -D USE_TEENSY

[__teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags = -D USE_TEENSY

[__seeed_xiao_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower
; DamarXCV/Teensy-DShot は Teensy専用のためXIAO(RP2040)側ではビルド対象から除外
lib_ignore = Teensy-DShot

[__uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -D USE_UNO


; --------------------------------------------------
; 各機体・プログラムの個別設定 (見違えるほどスッキリ！)
; --------------------------------------------------

; 双発機 (Teensy 4.0)
[env:auto_flight]
extends = __teensy40
; トレーナー機 (Seeed XIAO RP2040 移植版)
; Actuators.cpp は drone.cpp (Teensy4.1) が使い続けるファイルなので、
; ここでは明示的に除外しています
; (trainer.cppには同等の内容をDShot依存なしで直接展開済みのため、
;  Actuators.cppを一緒にリンクすると write() の多重定義エラーになる)
[env:trainer]
extends = __seeed_xiao_rp2040
build_src_filter = +<*> -<main.cpp> -<auto_flight.cpp> -<Zunrocoptor.cpp> -<uchida.cpp> -<drone.cpp> -<test.cpp> -<sub_lib/Actuators.cpp> +<trainer.cpp>
; オートジャイロ (Teensy 4.1)
[env:Zunrocoptor]
extends = __teensy41

; オートジャイロ (Teensy 4.1)
[env:drone]
extends = __teensy40

; オートジャイロ (Teensy 4.1)
[env:delta_auto]
extends = __teensy41
[env:test]
extends = __teensy41
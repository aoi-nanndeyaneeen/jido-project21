; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]

default_envs = auto_flight


; --- 機体/地上局で共有する無線プロトコル定義 (S5Cmd.h / S5Telem.h) の置き場 ---
;   リポジトリ直下の protocol/ を include パスに足す。ground_receiver 側も同じ。
;   ★ build_flags は extends 先で上書きされるので、各ハードテンプレートが
;     ${common.protocol_inc} を明示的に含めること。
[common]
protocol_inc = -I$PROJECT_DIR/../protocol

[env]
; --- 全環境共通の設定 ---
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bolderflight/Bolder Flight Systems SBUS @ ^8.1.4 
    bitcraze/Bitcraze PMW3901 @ ^1.2.0  ; 👈 公式レジストリ版のみ残す
    pololu/VL53L1X @ ^1.3.1              ; 距離センサ (drone_s5 s5c で使用)
    https://github.com/DamarXCV/Teensy-DShot.git


monitor_filters = direct
build_flags = -std=c++17 ${common.protocol_inc}

monitor_speed = 115200
; 各環境のメインファイル名と自動連動させるフィルター
;
; ★ 修正: 以前は「除外したいファイルを1つずつ並べる」方式でしたが、
;    -<drone.cpp>-<test.cpp>-<trainer.cpp> のように空白が抜けていて、l

;    PlatformIO が1つのトークンとして扱うため除外が効いていませんでした。
;    さらに src/ にファイルを追加するたびに、この行に追記が必要でした。
;
;    「まず全部除外して、必要なものだけ足す」方式に変えます。
;    こうすると新しい .cpp を足しても、この行を触る必要がありません。
build_src_filter = -<*> +<sub_lib/*.cpp> +<${PIOENV}.cpp>


; --- 基板ごとのハードウェアテンプレート（非表示セクション __ ） ---
; セクション名に「__」を付けることで、PlatformIOのビルド対象リストに出てこない「純粋な型」にできます
[__teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -D USE_TEENSY ${common.protocol_inc}
; ★ COM番号ではなく USB の VID:PID で指定する (16C0:0483 = Teensy USB Serial)。
;   Bluetooth の仮想COM や XIAO(COM5) を掴む事故を防ぎ、挿し直しにも追従する。
monitor_port = hwgrep://16C0:0483

[__teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags = -D USE_TEENSY ${common.protocol_inc}
; ★ COM番号ではなく USB の VID:PID で指定する (16C0:0483 = Teensy USB Serial)。
;   Bluetooth の仮想COM や XIAO(COM5) を掴む事故を防ぎ、挿し直しにも追従する。
monitor_port = hwgrep://16C0:0483

; ★ drone_s5 を Teensy からこの板へ移す方針 (ピン収支・T_FLOW・1000Hz 検証・
;   RamLog 縮小) は quad/LogLink.h 冒頭の「Teensy 故障時の移行方針」を読むこと。
[__seeed_xiao_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower
monitor_port = hwgrep://2E8A:000A
; ★ 2026-09-17: newlib-nano の printf は既定で浮動小数点非対応。
;   FlightLog::formatRow() の %f 列 (accx/roll_ang/m1〜4 など) が
;   エラーも出さず空欄で出力され、ログが読めなくなる。リンカに明示的に
;   浮動小数点版 printf/scanf を使わせる。
build_flags = ${common.protocol_inc} -Wl,-u_printf_float -Wl,-u_scanf_float
; DamarXCV/Teensy-DShot は Teensy専用のためXIAO(RP2040)側ではビルド対象から除外
lib_ignore = Teensy-DShot

[__uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -D USE_UNO ${common.protocol_inc}


; --------------------------------------------------
; 各機体・プログラムの個別設定 (見違えるほどスッキリ！)
; --------------------------------------------------

; 双発機 (Teensy 4.0)
[env:auto_flight]
extends = __teensy40
; トレーナー機 (Seeed XIAO RP2040 移植版)
; Actuators.cpp は drone.cpp (Teensy4.1) が使い続けるファイルなので、
; ここでは明示的に除外しています
; (trainer.cppには同等の内容をDShot依存なしで直接展開済みのため、
;  Actuators.cppを一緒にリンクすると write() の多重定義エラーになる)
[env:trainer]
extends = __seeed_xiao_rp2040
; trainer.cpp は Actuators.cpp と同じ write() を自前で持っているので、
; sub_lib/ を含めると多重定義になる。ここだけ trainer.cpp 単体でビルドする。
build_src_filter = -<*> +<trainer.cpp>

; オートジャイロ (Teensy 4.1)
[env:Zunrocoptor]
extends = __teensy41

; クアッドコプター 旧版 (Teensy 4.0) ← 現状のコード。手を付けていません
[env:drone]
extends = __teensy40

; オートジャイロ (Teensy 4.1)
[env:delta_auto]
extends = __teensy40
[env:test]
extends = __teensy40


; --------------------------------------------------
;  クアッドコプター 段階的リファクタリング (Teensy 4.0)
;  drone.cpp はそのまま残してあるので、いつでも戻れます。
;
;    s1 : 出力段の検証        (PIDなし / プロペラ外し)
;    s2 : ミキサーとセンサ軸  (PIDなし / プロペラ外し)
;    s3 : レートPID           (初飛行はここ)
;    s4 : 角度PID + モード切替
;    s5 : オプティカルフロー / 距離センサ / 自動ホバリング
;         s5a : PMW3901 搭載 + ログのみ (制御に入れない / 符号・スケール確認)
;         s5b : フロー速度・位置ホールド (高度は仮定値固定 / スロットル手動)
;         s5c : 高度ホールド (距離センサ搭載後 / 仮定高度を測距値に差し替え)
;         s5d : 完全自動ホバリング (高度+位置+ヘディングを1スイッチ)
;       drone_s5.cpp は現在 s5d (s5a〜s5d をすべて同ファイルに実装済み)。
;         運用は2モード: SW_HOVER down=ANGLE(手動) / up=POSHOLD(完全自動)。
;         測距は QuadConfig の RANGE_BACKEND で ToF(VL53L1X)/SONAR(MaxBotix EZ) 切替。
;
;  例:  pio run -e drone_s1 -t upload
;       pio device monitor -e drone_s1
; --------------------------------------------------
[env:drone_s1]
extends = __teensy40

[env:drone_s2]
extends = __teensy40

[env:drone_s3]
extends = __teensy40

[env:drone_s4]
extends = __teensy40

[env:drone_s5]
extends = __teensy40

; --------------------------------------------------
;  drone_s5 の XIAO RP2040 版 (2026-09-17 Teensy 故障で移行)
;  同じ src/drone_s5.cpp を板依存だけ #ifdef ARDUINO_ARCH_RP2040 で分岐して
;  ビルドする。ピン配置・ロガー側 (log_recorder) との分担は quad/BoardPins.h と
;  quad/LogLink.h 冒頭を参照。PMW3901 は FC には載せない (C3 側から T_FLOW で来る)。
;
;    pio run -e drone_s5_rp2040 -t upload
;    pio device monitor -e drone_s5_rp2040
;
;  ★ 既定の build_src_filter は ${PIOENV}.cpp = drone_s5_rp2040.cpp を探すので
;    ここで drone_s5.cpp を明示する。
; --------------------------------------------------
[env:drone_s5_rp2040]
extends = __seeed_xiao_rp2040
build_src_filter = -<*> +<sub_lib/*.cpp> +<drone_s5.cpp>
; IMU 取付け向き (センサ生軸 → 前・左・上)。2026-09-17 log_048 の実測で生軸がそのまま FLU
; (静止 az=+1.13g / 前下げで Y 軸まわり +60° / 右下げで X 軸まわり +56°、ジャイロ積分と一致)。
; 3 つの積は必ず +1。詳細は include/sensor/IMU.h 冒頭。
; IMU チップ (2026-09-18: MPU6050 → 秋月 AE-LSM6DSV16X)。レジスタ設定・スケール・
; 基板ジャンパ (J1 プルアップ / J2=0x6B / J3=0x6A) は include/sensor/IMU.h の ImuChip 参照。
; ★ 上の IMU_MOUNT は MPU6050 基板で測った値。LSM6DSV16X は軸の向きが別物なので、
;   載せ替えたら 'k' → 静止 az=+1g / 前下げ / 右下げ で必ず取り直すこと。
build_flags = ${__seeed_xiao_rp2040.build_flags}
    -D IMU_CHIP_LSM6DSV16X
    -D IMU_MOUNT_X=+1.0f -D IMU_MOUNT_Y=+1.0f -D IMU_MOUNT_Z=+1.0f
; ★ 2026-09-18: メインループは 1000Hz 目標に対して実効 630〜700Hz (LoopProfile 'w' /
;   ログの dt_us)。制御・推定は実測 dt で計算するよう直したので値は狂わないが、
;   周期そのものを上げたければ次の 2 つ (どちらも未検証。'w' の実効 Hz で効果を見る):
;     board_build.f_cpu = 200000000L   ; 133 → 200MHz (arduino-pico の常用範囲。フラッシュ分周は自動)
;     build_flags = ... -O2            ; 既定 -Os → -O2 (FPU 無しのソフト浮動小数が速くなる)


; --------------------------------------------------
;  ESCキャリブレーション専用 (Teensy 4.0)
;  ★プロペラを外して実行すること★
;  起動直後から10秒間 2000us を出し続けるので、その間にバッテリーを挿す。
;  終わったら必ず drone に戻すこと。
;
;    pio run -e esc_calib -t upload
;    (キャリブレーション後)
;    pio run -e drone -t upload
; --------------------------------------------------
[env:esc_calib]
extends = __teensy40

; --------------------------------------------------
;  IM920 疎通確認用 (Teensy 4.0) ※使い捨てスケッチ
;    pio run -e im920_test -t upload
;    pio device monitor -e im920_test
;  地上局側は ground_receiver の -e xiao_im920_test と対で使う。
; --------------------------------------------------
[env:im920_test]
extends = __teensy40
build_src_filter = -<*> +<im920_test.cpp>

; --------------------------------------------------
;  TSD20 (PONO 単点DTOF LiDAR) ベンチ疎通・性能確認 (XIAO RP2040) ※使い捨てスケッチ
;  COMPETITION_OPEN_ISSUES.md A1「3m超の高度をどう測るか」を飛ばさずに切り分ける用。
;  機体 (drone_s5_rp2040) には一切影響しない。実装案は used/tsd20_backend.patch。
;
;    pio run -e tsd20_test -t upload
;    pio device monitor -e tsd20_test
;
;  配線: SDA=D4/GP6  SCL=D5/GP7  VCC=3V3 (★5V不可)  GND
;  ★ IMU を挿さないのでバスにプルアップが無いことがある。SCAN が空なら 4.7k を疑う。
; --------------------------------------------------
[env:tsd20_test]
extends = __seeed_xiao_rp2040
build_src_filter = -<*> +<tsd20_test.cpp>

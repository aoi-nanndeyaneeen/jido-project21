; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; 普段使うのは s5 テレメトリ受信機 (XIAO RP2040)。
; ★ VSCode のツールバー (Upload / Serial Monitor) はここの env を使う。
;   旧地上局 main_pc.cpp を焼きたいときは -e teensy40 / -e seeed_xiao_rp2040 を明示する。
default_envs = xiao_s5_log

; --- Teensy 4.0 用 (600MHzの怪物) ---
[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags = -D USE_TEENSY

; --- XIAO RP2040 用 ---
[env:seeed_xiao_rp2040]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-rp2040
framework = arduino
upload_protocol = picotool
monitor_speed = 115200
; ★ COM番号ではなく USB の VID:PID で指定する。
;   Bluetooth の仮想COM (COM3/COM4) や Teensy(COM8) を掴んでしまう事故を防ぐ。
;   2E8A:000A = RP2040 の USB CDC。挿し直しで COM番号が変わっても追従する。
monitor_port = hwgrep://2E8A:000A

; --- Arduino Uno 用 ---
[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -D USE_UNO

[env]
; src/tools/ は疎通確認用の使い捨てスケッチ置き場。通常ビルドには含めない。
build_src_filter = +<*> -<tools/>
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
monitor_filters = direct

; --- IM920 疎通確認用 (XIAO RP2040) ---
;   pio run -e xiao_im920_test -t upload
[env:xiao_im920_test]
extends = env:seeed_xiao_rp2040
build_src_filter = -<*> +<tools/im920_passthrough.cpp>

; --- s5 (POSHOLD) テレメトリ受信 & CSV化 (XIAO RP2040) ---
;   機体側 drone_s5.cpp の S5T::State / S5T::Param を受けて CSV を吐く。
;     pio run -e xiao_s5_log -t upload
;     python tools/s5_logger.py            (CSV を logs/ に保存)
;     python tools/analyze_poshold.py      (保存した CSV を解析)
;   ★ include/S5Telem.h は flight_controller/include/S5Telem.h と
;     同一内容であること。片方だけ直すと値が壊れる。
[env:xiao_s5_log]
extends = env:seeed_xiao_rp2040
build_src_filter = -<*> +<tools/s5_log.cpp>

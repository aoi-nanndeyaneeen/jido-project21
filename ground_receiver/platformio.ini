; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; 普段使うのは s5 テレメトリ受信機 (XIAO RP2040) = src/main.cpp。
; ★ VSCode のツールバー (Upload / Serial Monitor) はここの env を使う。
;   旧地上局 (main_pc.cpp) とその env (teensy40 / uno) は used/ へ移した (2026-09-16)。
default_envs = xiao_s5_log

; --- 機体/地上局で共有する無線プロトコル定義 (S5Cmd.h / S5Telem.h / Im920Frame.h) ---
;   リポジトリ直下の protocol/ を include パスに足す。flight_controller 側も同じ。
[common]
protocol_inc = -I$PROJECT_DIR/../protocol

[env]
; src/tools/ は疎通確認用の使い捨てスケッチ置き場。通常ビルドには含めない。
build_src_filter = +<*> -<tools/>
monitor_filters = direct

; --- XIAO RP2040 用 (地上局のハード) ---
[env:seeed_xiao_rp2040]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1ec1287f8e4bc4067a6fd593991e36875aef989f
board = seeed-xiao-rp2040
framework = arduino
upload_protocol = picotool
monitor_speed = 115200
build_flags = ${common.protocol_inc}

; ★ COM番号ではなく USB の VID:PID で指定する。
;   Bluetooth の仮想COM (COM3/COM4) や Teensy(COM8) を掴んでしまう事故を防ぐ。
;   2E8A:000A = RP2040 の USB CDC。挿し直しで COM番号が変わっても追従する。
monitor_port = hwgrep://2E8A:000A

; --- s5 (POSHOLD/GUIDED) テレメトリ受信 & 上りコマンド中継 (XIAO RP2040) ---
;   機体側 drone_s5 の S5T::* フレームを受けて CSV を吐き、PC の "CMD,..." 行を
;   IM920 へ中継する。src/main.cpp (+ include/GroundConfig.h, TelemetryStore.h,
;   Uplink.h, StatusView.h)。
;     pio run -e xiao_s5_log -t upload
;     python ../position_estimator/src/console.py      (見ながら指令を出す)
;     python tools/s5_logger.py                        (CSV 保存だけ)
;   ★ パケット定義は ../protocol/ を機体と共有している。片方だけ焼き直すと
;     `# !! パケットバージョン不一致` が出る (出るように作ってある)。
[env:xiao_s5_log]
extends = env:seeed_xiao_rp2040

; --- IM920 疎通確認用 (XIAO RP2040) ---
;   pio run -e xiao_im920_test -t upload
[env:xiao_im920_test]
extends = env:seeed_xiao_rp2040
build_src_filter = -<*> +<tools/im920_passthrough.cpp>

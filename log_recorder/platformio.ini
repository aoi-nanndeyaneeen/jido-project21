; ============================================================
;  log_recorder  -  XIAO (RP2040 / ESP32C3 どちらも可) 専用ログレコーダ
; ============================================================
;  Teensy(FC) から UART でレコードを受け、自分の SPI で SD へ書く。
;  これで FC 側の SPI0 が空き、PMW3901 (フロー) と SD ログが共存できる
;  (flight_controller/src/drone_s5.cpp の USE_FLOW / USE_SD 排他が消える)。
;
;    pio run -e xiao_logger          -t upload   ; XIAO RP2040
;    pio run -e xiao_logger_esp32c3  -t upload   ; XIAO ESP32C3
;    pio device monitor -e <env>              ; 's' で状態、'f' で FS 情報
;
;  ★ フレーム定義 (quad/LogLinkProto.h) は flight_controller 側の実体を
;    直接 include している。コピーを作ると必ず片方だけ古くなるので、
;    build_flags の -I はこのままにすること。
;  ★ XIAO は RP2040/ESP32C3 でフットプリント・D番号が共通なので配線は
;    使い回せる (実 GPIO 番号の対応は src/main.cpp 側の #if で吸収)。
;    ただし ESP32C3 にはオンボードLEDが無いので状態表示は USB シリアルのみ。
; ============================================================
[platformio]
default_envs = xiao_logger

; ---- XIAO RP2040 --------------------------------------------------------
[env:xiao_logger]
; flight_controller の [__seeed_xiao_rp2040] と同じ core を使う。
; (Philhower core は Serial1.setFIFOSize() / setRX() / setup1() が使えるので必須。
;  Seeed 公式 platform の mbed core にはこれらが無い)
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower

lib_deps =
    greiman/SdFat @ ^2.2.2

build_flags =
    -std=c++17
    -I ../flight_controller/include        ; quad/LogLinkProto.h の実体

monitor_speed = 115200
monitor_filters = direct
; COM 番号ではなく VID:PID で指定する (2E8A:000A = RP2040 の USB CDC)。
; 地上局の XIAO や Teensy を掴む事故を防ぐ。
monitor_port = hwgrep://2E8A:000A
upload_protocol = picotool

; ---- XIAO ESP32C3 --------------------------------------------------------
;  シングルコアなので RP2040 版の core0/core1 分離は使えない。
;  main.cpp 側で rx=loop()、sd=専用 FreeRTOS タスクという役割分担に
;  置き換えている (詳細は main.cpp 冒頭コメント参照)。
[env:xiao_logger_esp32c3]
platform = espressif32 @ 7.0.1
board = seeed_xiao_esp32c3
framework = arduino

lib_deps =
    greiman/SdFat @ ^2.2.2

build_flags =
    -std=c++17
    -I ../flight_controller/include        ; quad/LogLinkProto.h の実体

monitor_speed = 115200
monitor_filters = direct
; ESP32C3 のネイティブ USB CDC (303A:1001)。
monitor_port = hwgrep://303A:1001

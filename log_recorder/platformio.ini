; ============================================================
;  log_recorder  -  XIAO ESP32C3 専用 BLE ログ中継機
; ============================================================
;  Teensy(FC) から UART でレコードを受け、BLE Notify で常時外部へ送信する。
;  (元は SD へ書いていたが、SD カードが壊れたため BLE 送信に置き換えた。
;   ボードも RP2040/ESP32C3 両対応をやめ、内蔵 BLE を持つ ESP32C3 専用にした)
;
;    pio run -e xiao_logger_esp32c3  -t upload
;    pio device monitor -e xiao_logger_esp32c3   ; 's' で状態、'r' で統計リセット
;
;  ★ フレーム定義 (quad/LogLinkProto.h) は flight_controller 側の実体を
;    直接 include している。コピーを作ると必ず片方だけ古くなるので、
;    build_flags の -I はこのままにすること。
;  ★ BLE の帯域制約と間引き設定 (BLE_REC_DECIM) は src/main.cpp 冒頭コメント参照。
; ============================================================
[platformio]
default_envs = xiao_logger_esp32c3

; ---- XIAO ESP32C3 --------------------------------------------------------
;  シングルコアなので rx=loop()、ble=専用 FreeRTOS タスクという役割分担に
;  している (詳細は main.cpp 冒頭コメント参照)。
[env:xiao_logger_esp32c3]
platform = espressif32 @ 7.0.1
board = seeed_xiao_esp32c3
framework = arduino

build_flags =
    -std=c++17
    -I ../flight_controller/include        ; quad/LogLinkProto.h の実体
    -I ../protocol                         ; S5Cmd.h (操縦指令の中継でサイズと seq の位置だけ使う)

monitor_speed = 115200
monitor_filters = direct
; ESP32C3 のネイティブ USB CDC (303A:1001)。
monitor_port = hwgrep://303A:1001
